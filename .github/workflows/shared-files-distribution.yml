name: Shared Files Distribution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-and-test:
    name: Sync Shared Files & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Missing or divergent copies are release blockers.
      - name: Verify shared files are in sync
        run: bash scripts/sync-scripts.sh --check

      # CLI smoke test against the canonical source
      - name: CLI smoke test
        run: python zoodata/scripts/zoodata.py --help
